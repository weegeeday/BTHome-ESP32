[env:m5stack-atoms3]
platform = espressif32@6.10.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    Wire
    SPI

build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
