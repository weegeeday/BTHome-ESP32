[env:m5stack-atoms3]
platform = espressif32@6.10.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit PN532 @ ^1.3.3
    Wire
    SPI

build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
